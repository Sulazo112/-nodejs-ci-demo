name: Full Node.js CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CUSTOM_VAR: "my-custom-value"

jobs:
  build-test-matrix:
    name: Build & Test on Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [12.x, 14.x, 16.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache npm modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npx eslint .

    - name: Run Test Suite
      run: npm test

  example-env:
    runs-on: ubuntu-latest
    steps:
    - name: Show custom environment variable
      run: echo "CUSTOM_VAR is $CUSTOM_VAR"

  deploy:
    runs-on: ubuntu-latest
    needs: build-test-matrix
    steps:
    - name: Copy SSH key to runner
      run: |
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key

    - name: Deploy to EC2 server
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key ec2-user@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
        cd /home/ec2-user/app
        git pull origin main
        npm ci
        npm run build
        pm2 restart app
        EOF

  conditional-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

  output-example:
    runs-on: ubuntu-latest
    steps:
    - id: step-one
      run: echo "value=hello" >> $GITHUB_OUTPUT

    - id: step-two
      run: echo "Received value: ${{ steps.step-one.outputs.value }}"

